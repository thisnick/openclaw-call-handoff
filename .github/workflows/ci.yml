name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check tag matches package and manifest versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./package.json').version")" = "$tag"
          test "$(node -p "require('./openclaw.plugin.json').version")" = "$tag"
      - run: npm pack
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum openclaw-call-handoff-*.tgz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" openclaw-call-handoff-*.tgz SHA256SUMS \
            --title "$GITHUB_REF_NAME" --generate-notes
